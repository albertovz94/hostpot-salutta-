<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Error de Conexión - Salutta</title>
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<style>
.error-card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 390px;
    padding: 3.4rem 1.8rem 2.2rem 1.8rem;
    text-align: center;
    position: relative;
    margin-top: 50px;
    animation: fadeInCard 0.45s ease-out;
}
.error-title {
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--color-black);
    margin-top: 0.8rem;
    margin-bottom: 0.5rem;
}
.error-desc {
    font-size: 0.92rem;
    color: var(--color-text-muted);
    margin-bottom: 1.4rem;
    line-height: 1.4;
}
.error-details {
    background: var(--color-error-bg);
    color: var(--color-error);
    border: 1px solid rgba(239, 68, 68, 0.25);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="main-container">
    <div class="error-card">
        
        <div class="logo-container">
            <img src="log.jpg" alt="Salutta Logo">
        </div>

        <div class="error-title">Error de Conexión</div>
        <div class="error-desc">Ha ocurrido un inconveniente al intentar conectar su dispositivo:</div>

        <div class="error-details">
            $(error)
        </div>

        <div>
            <a class="btn-link" href="$(link-login)">
                <button type="button" class="btn btn-login" style="margin-bottom:0;">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 4v6h6"></path>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                    INTENTAR DE NUEVO
                </button>
            </a>
        </div>

        <p class="footer-text">SALUTTA</p>
    </div>
</div>

</body>
</html>
