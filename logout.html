<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sesión Finalizada - Salutta</title>
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<style>
.logout-card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 390px;
    padding: 3.4rem 1.8rem 2rem 1.8rem;
    text-align: center;
    position: relative;
    margin-top: 50px;
    animation: fadeInCard 0.45s ease-out;
}
.logout-title {
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--color-black);
    margin-top: 0.8rem;
    margin-bottom: 0.5rem;
}
.logout-subtitle {
    font-size: 0.9rem;
    color: var(--color-text-muted);
    margin-bottom: 1.4rem;
}
</style>
<script language="JavaScript">
<!--
function openLogin() {
    if (window.name != 'hotspot_logout') return true;
    open('$(link-login)', '_blank', '');
    window.close();
    return false;
}
//-->
</script>
</head>

<body>

<div class="main-container">
    <div class="logout-card">
        
        <div class="logo-container">
            <img src="log.jpg" alt="Salutta Logo">
        </div>

        <div class="logout-title">Has cerrado sesión</div>
        <div class="logout-subtitle">Gracias por conectarte a nuestra red</div>

        <table class="tabula">  
            <tr><td align="left">Usuario</td><td align="right">$(username)</td></tr>
            <tr><td align="left">Dirección IP</td><td align="right">$(ip)</td></tr>
            <tr><td align="left">Dirección MAC</td><td align="right">$(mac)</td></tr>
            <tr><td align="left">Tiempo de sesión</td><td align="right">$(uptime)</td></tr>
            $(if session-time-left)
            <tr><td align="left">Tiempo restante</td><td align="right">$(session-time-left)</td></tr>
            $(endif)
            <tr><td align="left">Subida / Bajada</td><td align="right">$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
        </table>

        <div style="margin-top: 1.5rem;">
            <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <button type="submit" class="btn btn-login" style="margin-bottom:0;">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    VOLVER A CONECTAR
                </button>
            </form>
        </div>

        <p class="footer-text">SALUTTA</p>
    </div>
</div>

</body>
</html>
